# Default values for deploy api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# override values of dependency k8sdeployments
k8sdeployments:
  replicaCount: 1

  image:
    name: "nexhub.nebula.prod/kbt/nexops/deployment-api:TWPROD-latest"
    pullSecretName: regcred-secret

  ingress:
    enabled: true
    hosts:
      - host: deployapi-tw.starixplay.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
