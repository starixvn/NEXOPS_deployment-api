image: hub.nexdev.net/base/docker:24.0.4-bash-jq-jinja

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "k8s"
      when: always
    - when: never

stages:
  - build
  - post-build
  - deploy

include:
  - project: 'ci/common-ci'
    ref: master
    file: 'rocketor-integration/rules/index.gitlab-ci.yml'
  - project: 'ci/common-ci'
    ref: master
    file: 'docker/base/build-docker-image.gitlab-ci.yml'

variables:
  PROJECT_ROOT_PATH: .
  DOCKER_IMAGE_PATH: nexops/deployment-api
  DOCKER_FILE_PATH: ./
  DOCKER_FILE_NAME: Dockerfile
  CONFIG_FILE_PATH: ./src
  CONFIG_FILE_NAME: configs
  CONFIG_FILE_EXTENSION: js
  DOCKER_REG_LUMINET_URL: hub.lumigame.com
  APP_NAME: "deployapi"
  KUBERNETES_NAMESPACE: "default"
  EKS_LOCAL: "eks_LOCAL"

before_script:
  - export DEPLOY_ENV=$CI_ENVIRONMENT_NAME;
  - export CI_REGISTRY_IMAGE=$DOCKER_REG_URL/$DOCKER_IMAGE_PATH
  - export CI_REGISTRY_IMAGE_LUMINET=$DOCKER_REG_LUMINET_URL/$DOCKER_IMAGE_PATH
  - export CI_REGISTRY_IMAGE_VERSION=${CI_COMMIT_SHA:0:8}
  - echo $CI_REGISTRY_IMAGE
  - echo $CI_REGISTRY_IMAGE_LUMINET
  - export CONFIG_FILE=$CONFIG_FILE_NAME.${DEPLOY_ENV}.$CONFIG_FILE_EXTENSION;
  - export CONFIG_DEST_FILE=$CONFIG_FILE_NAME.$CONFIG_FILE_EXTENSION;
  - cp $CONFIG_FILE_PATH/$CONFIG_FILE $CONFIG_FILE_PATH/$CONFIG_DEST_FILE  

.custom_post_build:
  stage: post-build
  script:   
    - docker login -u $DOCKER_REG_USERNAME -p $DOCKER_REG_PASSWORD $DOCKER_REG_URL
    - docker login -u $DOCKER_REG_USERNAME -p $DOCKER_REG_PASSWORD $DOCKER_REG_LUMINET_URL
    - docker pull $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
    - docker tag $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest $CI_REGISTRY_IMAGE_LUMINET:$DEPLOY_ENV-latest
    - docker push $CI_REGISTRY_IMAGE_LUMINET:$DEPLOY_ENV-latest
  tags:
    - docker

build_eks_local:
  extends: 
    - .build:default:image
  environment:
    name: eks_LOCAL

post_build_eks_local:
  needs: ['build_eks_local']
  extends: 
    - .custom_post_build
  environment:
    name: eks_LOCAL

deploy_eks_local:
  stage: deploy
  image: dtzar/helm-kubectl:3.12.3
  variables:
    REGISTRY_URL: hub.lumigame.com
    CHART_BASE_URL: "oci://${REGISTRY_URL}/charts"
  environment:
    name: eks_LOCAL
  needs: ['post_build_eks_local']
  when: manual
  before_script:
    - apk add py-pip --update
    - pip install awscli
    - aws eks --region ${AWS_DEFAULT_REGION} update-kubeconfig --name ${KUBERNETES_CLUSTER}
    - helm registry login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $REGISTRY_URL
  script:
    - helm upgrade -i imagepullsecrets $CHART_BASE_URL/imagepullsecrets --history-max 5 -n $KUBERNETES_NAMESPACE --set imageCredentials.registry=$CHART_BASE_URL
      --set imageCredentials.username=$DOCKER_REG_LOCAL_USERNAME --set imageCredentials.password=$DOCKER_REG_LOCAL_PASSWORD
    - helm upgrade -i $APP_NAME $CHART_BASE_URL/deployapi --history-max 5 -n $KUBERNETES_NAMESPACE -f helm/configs/values.yaml
