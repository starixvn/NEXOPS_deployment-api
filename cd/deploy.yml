variables:
  APP_NAME: "deployapi"
  K8S_NAMESPACE: "default"
  CHART_BASE_URL: "oci://${REGISTRY_URL}/charts"

.deploy_base:
  stage: deploy
  image: hub.nexdev.net/base/dtzar/helm-kubectl:3.12.3
  tags:
    - docker
  script:
    - helm upgrade -i imagepullsecrets $CHART_BASE_URL/imagepullsecrets --history-max 5 -n $K8S_NAMESPACE --set imageCredentials.registry=$CHART_BASE_URL
      --set imageCredentials.username=$DOCKER_REG_LOCAL_USERNAME --set imageCredentials.password=$DOCKER_REG_LOCAL_PASSWORD
    - helm upgrade -i $APP_NAME ./helm/ --history-max 5 -n $K8S_NAMESPACE -f ./helm/configs/values.${CI_ENVIRONMENT_NAME}.yaml

.deploy_eks_base:
  extends:
    - .deploy_base
  before_script:
    - apk add py-pip --update && pip install awscli
    - aws eks --region ${AWS_DEFAULT_REGION} update-kubeconfig --name ${KUBERNETES_CLUSTER}
    - helm registry login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $REGISTRY_URL

deploy_eks_local:
  extends:
    - .deploy_eks_base
    - .env_eks_local
  variables:
    AWS_ACCESS_KEY_ID: AKIAYP7ZS6XE7VHD6JFG
    AWS_SECRET_ACCESS_KEY: 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
    AWS_DEFAULT_REGION: ap-east-1
    KUBERNETES_CLUSTER: lumi-local-eks
    REGISTRY_URL: hub.lumigame.com
  needs: ['post_build_eks_local']

deploy_k8s_local:
  extends:
    - .deploy_base
    - .env_k8s_local
  variables:
    REGISTRY_URL: hub.lumigame.com
  needs: ['post_build_k8s_local']
  before_script:
    - |
      mkdir /root/.kube
      cp ./cd/configs/kubeconfig.k8slocal /root/.kube/config
      chmod 400 /root/.kube/config
    - helm registry login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $REGISTRY_URL

