variables:
  APP_NAME: "deployapi"
  K8S_NAMESPACE: nexpe
  REGISTRY_URL: hub.lumigame.com
  CHART_BASE_URL: "oci://${REGISTRY_URL}/charts"
  REGISTRY_PULL_IMAGE: "https://${REGISTRY_URL}"

.deploy_k8s_before_script:
  before_script:
    - |
      mkdir /root/.kube
      cp ./cd/configs/kubeconfig.${CI_ENVIRONMENT_NAME} /root/.kube/config
      chmod 400 /root/.kube/config
    - |
      # Create namespace if it doesn't exist
      kubectl get namespace ${K8S_NAMESPACE} || kubectl create namespace ${K8S_NAMESPACE}
    - helm registry login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $REGISTRY_URL

.deploy_base:
  stage: deploy
  image: hub.nexdev.net/base/dtzar/helm-kubectl:3.12.3
  tags:
    - docker
  script:
    - helm upgrade -i imagepullsecrets $CHART_BASE_URL/imagepullsecrets --history-max 5 -n $K8S_NAMESPACE --set imageCredentials.registry=$REGISTRY_PULL_IMAGE
      --set imageCredentials.username=$DOCKER_REG_LOCAL_USERNAME --set imageCredentials.password=$DOCKER_REG_LOCAL_PASSWORD
    - helm upgrade -i $APP_NAME ./helm/ --history-max 5 -n $K8S_NAMESPACE -f ./helm/configs/values.${CI_ENVIRONMENT_NAME}.yaml

.deploy_eks_base:
  extends:
    - .deploy_base
  before_script:
    - apk add py-pip --update && pip install awscli
    - aws eks --region ${AWS_DEFAULT_REGION} update-kubeconfig --name ${KUBERNETES_CLUSTER} && cat /root/.kube/config
    - helm registry login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $REGISTRY_URL
    - kubectl get namespace $K8S_NAMESPACE || kubectl create namespace $K8S_NAMESPACE

