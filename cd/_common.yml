image: hub.nexdev.net/base/docker:24.0.4-bash-jq-jinja

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "k8s-tw"
      when: always
    - when: never

stages:
  - build
  - post-build
  - deploy

.env_k8s_twprod:
  environment:
    name: "TWPROD"

.env_k8s_twkl:
  environment:
    name: "TWKL"

.env_k8s_twsit:
  environment:
    name: "TWSIT"