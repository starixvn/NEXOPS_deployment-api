image: hub.nexdev.net/base/docker:24.0.4-bash-jq-jinja

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "k8s"
      when: always
    - when: never

stages:
  - build
  - post-build
  - deploy

.env_eks_local:
  environment:
    name: "EKSLOCAL"

.env_k8s_local:
  environment:
    name: "K8SLOCAL"

.env_k8s_uat:
  environment:
    name: "K8SUAT"

.env_eks_uat:
  environment:
    name: "EKSUAT"

.env_eks_prod:
  environment:
    name: "EKSPROD"