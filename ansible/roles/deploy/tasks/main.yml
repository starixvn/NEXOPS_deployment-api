---
- name: Verify stacks directory exists (on first swarm node)
  file:
    path: "/home/{{ansible_user}}/stacks/{{env}}{{version}}"
    state: directory
  become: yes

- name: Create directory
  file:
    path: "{{gluster_path}}/deployment-api"
    mode: "0755"
    state: directory
  become: yes

# - name: Create network
#   docker_network:
#     name: "{{swarm_network_nexops}}"
#     driver: "overlay"
#     ipam_config:
#       - subnet: 192.168.0.0/24
#     attachable: true
#   ignore_errors: yes
#   become: yes

- name: Copy docker-compose file
  template:
    src: "templates/docker-compose.yml.j2"
    dest: /home/{{ansible_user}}/stacks/{{env}}{{version}}/deployment-api-stack.yml
  become: yes

- name: Login
  shell: |
    cd /home/{{ansible_user}}/stacks/{{env}}{{version}}
    docker login --username='gitlab-ci' --password='H5nF5ywy262wt881ZWpq' {{ lookup('vars', org + '_deploymentapi_image_' + env) }}
  ignore_errors: yes

- name: Build up and run container
  shell: |
    cd /home/{{ansible_user}}/stacks/{{env}}{{version}}
    docker login --username='gitlab-ci' --password='H5nF5ywy262wt881ZWpq' {{ lookup('vars', org + '_deploymentapi_image_' + env) }}
    docker stack deploy --compose-file=deployment-api-stack.yml --with-registry-auth nexops
  become: yes
