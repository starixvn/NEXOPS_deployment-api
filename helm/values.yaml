# Default values for deploy api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# override values of dependency k8sdeployments
k8sdeployments:
  replicaCount: 2

  image:
    name: ""
    pullPolicy: Always

  healthCheck:
    enabled: true
    path: /
    failureThreshold: 5
    periodSeconds: 5
    timeoutSeconds: 5
    startupFailureThreshold: 30

  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
    port: 22222
    targetPort: 22222

  ingress:
    enabled: false
  #  className: ""
  #  annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts: []
    #  - host: chart-example.local
    #    paths:
    #      - path: /
    #        pathType: Prefix
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources:
    limits:
      memory: 2048Mi
    requests:
      memory: 128Mi

  serviceAccount:
    create: true
    annotations: {}

  nodeSelector: {}