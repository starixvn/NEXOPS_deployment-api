# Default values for deploy api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# override values of dependency k8sdeployments
k8sdeployments:
  replicaCount: 1

  image:
    name: "hub.lumigame.com/nexops/deployment-api:K8SLOCAL-latest"
    pullSecretName: regcred-secret

  ingress:
    enabled: true
    hosts:
      - host: deployapi-k8s.lumigame.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  nodeSelector: {}
  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
