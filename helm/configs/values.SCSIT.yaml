# Default values for deploy api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# override values of dependency k8sdeployments
k8sdeployments:
  replicaCount: 1

  image:
    name: "lumhub.ops-sit.nebula.sit/kbt/nexpe/deployment-api:SCSIT-latest"
    pullSecretName: regcred-secret

  ingress:
    enabled: true
    hosts:
      - host: deployapi-sc.playonesit.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  nodeSelector:
    #haproxy: "yes"
  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
