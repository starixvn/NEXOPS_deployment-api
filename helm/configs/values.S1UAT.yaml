# Default values for deploy api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# override values of dependency k8sdeployments
k8sdeployments:
  replicaCount: 1

  image:
    name: "s1hub.nebula.prod/kbt/nexops/deployment-api:S1UAT-latest"
    pullSecretName: regcred-secret

  ingress:
    enabled: true
    hosts:
      - host: s1deployapi.starixuat.com
        paths:
          - path: /
            pathType: Prefix
      - host: s1deployapi2.starixuat.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  nodeSelector:
    #haproxy: "yes"
  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
