# Default values for deploy api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# override values of dependency k8sdeployments
k8sdeployments:
  replicaCount: 1

  image:
    name: "hub.nexdev.net/nexops/deployment-api:K3SNEXPROD-latest"
    pullSecretName: regcred-secret

  ingress:
    enabled: true
    hosts:
      - host: deployapi-k3s.nexdev.net
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  nodeSelector:
    nexops-tools: "yes"
  service:
  # kind of types: ClusterIP, NodePort, LoadBalancer
    type: ClusterIP
